name: Sentinel Consig - Backup PostgreSQL criptografado

on:
  # Executa uma vez quando o proprio workflow e atualizado na main.
  push:
    branches: [main]
    paths:
      - '.github/workflows/neon-external-backup.yml'
  workflow_dispatch:
  schedule:
    # UTC: 00:17, 06:17, 12:17 e 18:17
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: sentinelconsig-production-pg-backup
  cancel-in-progress: false

jobs:
  backup:
    name: PostgreSQL 18 + AES-256 + GitHub Artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Conferir configuracao segura
        env:
          DATABASE_URL: ${{ secrets.NEON_BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::Cadastre NEON_BACKUP_DATABASE_URL em Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [[ -z "$BACKUP_ENCRYPTION_PASSPHRASE" ]]; then
            echo "::error::Cadastre BACKUP_ENCRYPTION_PASSPHRASE em Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [[ "$DATABASE_URL" != postgresql://* && "$DATABASE_URL" != postgres://* ]]; then
            echo "::error::NEON_BACKUP_DATABASE_URL nao e uma URL PostgreSQL valida."
            exit 1
          fi
          if [[ "$(printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | wc -c)" -lt 24 ]]; then
            echo "::error::Use uma senha aleatoria com pelo menos 24 bytes para criptografar o backup."
            exit 1
          fi
          echo "Segredos presentes e com formato minimo valido (valores ocultos)."

      - name: Gerar dump e verificar recuperacao criptografada
        env:
          DATABASE_URL: ${{ secrets.NEON_BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          WORK_DIR="$(mktemp -d)"
          ARTIFACT_DIR="$RUNNER_TEMP/sentinelconsig-encrypted-backup"
          mkdir -p "$ARTIFACT_DIR"
          chmod 700 "$ARTIFACT_DIR"
          trap 'rm -rf "$WORK_DIR"' EXIT

          TIMESTAMP="$(date -u +'%Y%m%dT%H%M%SZ')"
          PLAIN_FILE="sentinelconsig-public-$TIMESTAMP.dump"
          ENCRYPTED_FILE="$ARTIFACT_DIR/$PLAIN_FILE.gpg"

          # O schema public contem os dados da aplicacao. Neon Auth e schemas de sistema nao sao incluidos.
          docker run --rm -e DATABASE_URL -v "$WORK_DIR:/work" postgres:18 \
            sh -euc 'pg_dump --dbname "$DATABASE_URL" --format=custom --no-owner --no-acl --schema=public --file="/work/backup.dump" && pg_restore --list "/work/backup.dump" >/dev/null'

          test -s "$WORK_DIR/backup.dump"

          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" |
            gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 0 \
              --symmetric --cipher-algo AES256 --output "$ENCRYPTED_FILE" "$WORK_DIR/backup.dump"
          test -s "$ENCRYPTED_FILE"

          # Verifica que a senha recupera exatamente o dump original.
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" |
            gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 0 \
              --decrypt --output "$WORK_DIR/verified.dump" "$ENCRYPTED_FILE"
          cmp -s "$WORK_DIR/backup.dump" "$WORK_DIR/verified.dump"

          docker run --rm -v "$WORK_DIR:/work:ro" postgres:18 \
            pg_restore --list "/work/verified.dump" >/dev/null

          (
            cd "$ARTIFACT_DIR"
            sha256sum "$PLAIN_FILE.gpg" > SHA256SUMS.txt
          )
          echo "Dump PostgreSQL 18 criado, criptografado e validado."
          echo "Tamanho do arquivo criptografado: $(wc -c < "$ENCRYPTED_FILE") bytes."

      - name: Armazenar somente arquivos criptografados por 7 dias
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinelconsig-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sentinelconsig-encrypted-backup/*.gpg
            ${{ runner.temp }}/sentinelconsig-encrypted-backup/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Apagar os arquivos temporarios do runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/sentinelconsig-encrypted-backup"
